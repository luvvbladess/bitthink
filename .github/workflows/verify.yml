name: Verify BitThink
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bitthink_ci
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: bitthink_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bitthink_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://bitthink_ci:isolated_ci_only@127.0.0.1:5432/bitthink_ci
      SECRET_KEY: isolated-github-test-session-key-never-used-in-production
      OPENAI_API_KEY: test-key
      DEEPSEEK_API_KEY: test-key
      KIMI_API_KEY: test-key
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui fonts-liberation libcairo2
      - run: pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - name: Verify schema and domain boundaries before test setup
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from sqlalchemy import inspect
          from app.db import models, project_models
          from app.db.base import Base
          from app.db.engine import sync_engine
          schema = inspect(sync_engine)
          for name, table in Base.metadata.tables.items():
              assert schema.has_table(name), f'Missing migration for {name}'
              columns = {column['name'] for column in schema.get_columns(name)}
              assert set(table.columns.keys()) <= columns, f'Missing columns in {name}'
          for folder in ['app/api', 'app/services']:
              for path in Path(folder).glob('*.py'):
                  tree = ast.parse(path.read_text())
                  assert not any(isinstance(node, ast.Attribute) and node.attr == '_manager' and isinstance(node.value, ast.Name) and node.value.id == 'repo' for node in ast.walk(tree)), f'Private engine dependency in {path}'
          PY
      - run: python -m pytest tests
      - run: python -m evals.quality --report /tmp/bitthink-quality.json
      - run: python -m evals.product_journeys --fixtures --report /tmp/bitthink-product-journeys.json
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run dev -- --host 127.0.0.1 --port 5187 > /tmp/bitthink-vite.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:5187 >/dev/null && break; sleep 1; done
          npm run test:ux
        env:
          PLAYWRIGHT_CHANNEL: chromium
