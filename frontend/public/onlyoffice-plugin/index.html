<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>ИИ-правка</title>
  <!-- SDK с нашего сервера документов; если путь другой – с сайта OnlyOffice. -->
  <script src="/onlyoffice/sdkjs-plugins/v1/plugins.js"></script>
  <script>
    if (!window.Asc || !window.Asc.plugin) {
      document.write('<script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"><\/script>');
    }
  </script>
  <style>
    body { margin: 0; font: 13px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1f2328; }
    /* Рамка плагина не прокручивается сама: прокручиваем свой блок. */
    .scroll { position: fixed; inset: 0; overflow-y: auto; padding: 12px; box-sizing: border-box; }
    label { display: block; font-weight: 600; margin: 10px 0 4px; }
    textarea { width: 100%; box-sizing: border-box; border: 1px solid #c9d1d9; border-radius: 6px; padding: 6px 8px; font: inherit; resize: vertical; }
    textarea:focus { outline: 2px solid #1a8fc4; outline-offset: -1px; }
    .selection { max-height: 110px; overflow: auto; background: #f6f8fa; border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; color: #57606a; }
    .row { display: flex; gap: 6px; margin-top: 8px; }
    button { flex: 1; border: 0; border-radius: 6px; padding: 7px 10px; font: inherit; font-weight: 600; cursor: pointer; background: #1a8fc4; color: #fff; }
    button.secondary { background: #eaeef2; color: #1f2328; }
    button:disabled { opacity: .5; cursor: default; }
    .status { margin-top: 8px; min-height: 18px; color: #57606a; }
    .status.error { color: #cf222e; }
    .hint { color: #57606a; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="scroll">
  <label>Выделенный фрагмент</label>
  <div id="selection" class="selection">Выделите текст в документе. Без выделения ИИ напишет текст для вставки в место курсора.</div>

  <label for="instruction">Что сделать</label>
  <textarea id="instruction" rows="4" placeholder="Например: перепиши пункт по комментарию юриста – срок оплаты 10 рабочих дней"></textarea>
  <div class="row"><button id="generate">Сгенерировать</button></div>

  <label for="result">Вариант – можно поправить</label>
  <textarea id="result" rows="7" placeholder="Здесь появится текст"></textarea>
  <div class="row">
    <button id="insert" disabled>Вставить в документ</button>
    <button id="again" class="secondary" disabled>Ещё вариант</button>
  </div>
  <div id="status" class="status" role="status"></div>
  <div class="row"><button id="scrub" class="secondary">Убрать ### и ** из документа</button></div>
  <div class="hint">Вставка идёт в режиме рецензирования: видно, что было и что стало, правку можно принять или отклонить. Закрыли панель – верните её кнопкой «ИИ-правка» над документом.</div>
  </div>

  <script>
    (function (window) {
      var plugin = window.Asc.plugin;
      var selection = '';
      // Фрагмент, для которого написан вариант: {start, end, text}. Вставка
      // заменяет именно его, даже если потом кликнули в другое место документа.
      var target = null;
      var $ = function (id) { return document.getElementById(id); };

      function session() {
        try { return JSON.parse(window.sessionStorage.getItem('bt-editor-session') || 'null'); } catch (e) { return null; }
      }

      function setStatus(text, isError) {
        $('status').textContent = text || '';
        $('status').className = isError ? 'status error' : 'status';
      }

      function showSelection() {
        $('selection').textContent = selection
          || (target ? target.text : 'Ничего не выделено: текст вставится в место курсора.');
      }

      // Запоминает выделение как место замены. Без выделения прежнее место остаётся:
      // кликнули в документ, пока правили вариант, – замена всё равно пойдёт туда.
      function captureTarget(done) {
        plugin.callCommand(function () {
          var range = Api.GetDocument().GetRangeBySelect();
          if (!range) return null;
          var start = range.GetStartPos(), end = range.GetEndPos(), text = range.GetText();
          // Тройной клик берёт и конец абзаца. Замена удалила бы его, и после
          // «принять» пункт слипся бы со следующим.
          if (/[\r\n]$/.test(text) && end > start) {
            end -= 1;
            text = Api.GetDocument().GetRange(start, end).GetText();
          }
          return text ? { start: start, end: end, text: text } : null;
        }, false, false, function (found) {
          if (found) target = found;
          if (done) done();
        });
      }

      function readSelection(done) {
        plugin.executeMethod('GetSelectedText', [{ Numbering: true, Math: false, TableCellSeparator: '\n', ParaSeparator: '\n', TabSymbol: '\t' }], function (text) {
          selection = text || '';
          showSelection();
          if (done) done();
        });
      }

      function generate() {
        var s = session();
        var instruction = $('instruction').value.trim();
        if (!s || !s.docId) { setStatus('Откройте документ заново из чата Bit-Think.', true); return; }
        if (!instruction) { setStatus('Напишите, что сделать с фрагментом.', true); return; }
        $('generate').disabled = true; $('again').disabled = true;
        setStatus('Пишу вариант...');
        readSelection(function () { captureTarget(function () {
          showSelection();
          fetch('/api/editor/' + encodeURIComponent(s.docId) + '/ai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.aiToken },
            body: JSON.stringify({ selection: selection || (target ? target.text : ''), instruction: instruction })
          }).then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (data) {
              if (!res.ok) throw new Error(data.detail || 'Не получилось, попробуйте ещё раз');
              return data;
            });
          }).then(function (data) {
            $('result').value = data.text || '';
            $('insert').disabled = !data.text;
            setStatus('Поправьте текст, если нужно, и вставьте.');
          }).catch(function (e) {
            setStatus(e.message, true);
          }).then(function () {
            $('generate').disabled = false; $('again').disabled = false;
          });
        }); });
      }

      function insert() {
        var text = $('result').value;
        if (!text.trim()) return;
        window.Asc.scope.target = target;
        // Рецензирование на время вставки: правка ИИ видна как изменение, которое можно отклонить.
        plugin.callCommand(function () {
          var doc = Api.GetDocument();
          var was = doc.IsTrackRevisions();
          var t = Asc.scope.target;
          var found = !t;
          if (t) {
            // Выделяем исходный фрагмент заново: вставка заменит его, а не встанет у курсора.
            var range = doc.GetRange(t.start, t.end);
            if (!range || range.GetText() !== t.text) {
              // Выше что-то дописали, и фрагмент сдвинулся: ищем его по тексту.
              var hits = doc.Search(t.text, true);
              range = hits && hits.length ? hits[0] : null;
            }
            if (range) {
              range.Select();
              found = true;
            }
          }
          if (found) doc.SetTrackRevisions(true);
          return { was: was, found: found };
        }, false, false, function (res) {
          if (!res || !res.found) {
            setStatus('Исходный фрагмент изменился. Выделите его заново и нажмите «Ещё вариант».', true);
            return;
          }
          plugin.executeMethod('PasteText', [text], function () {
            if (!res.was) {
              plugin.callCommand(function () { Api.GetDocument().SetTrackRevisions(false); }, false, false);
            }
            setStatus(target ? 'Старый текст заменён – правку можно принять или отклонить.' : 'Вставлено как правка.');
            target = null;
            showSelection();
            $('insert').disabled = true;
          });
        });
      }

      // Остатки markdown в тексте («### 2.1.4 …», «**»): модель тут не нужна, хватит замены.
      // Одиночную «# » не трогаем – она бывает в обычном тексте («C# »).
      function scrub() {
        plugin.callCommand(function () {
          var doc = Api.GetDocument();
          ['###### ', '##### ', '#### ', '### ', '## ', '**'].forEach(function (mark) {
            doc.SearchAndReplace({ searchString: mark, replaceString: '', matchCase: true });
          });
        }, false, true, function () {
          setStatus('Разметка убрана. Если что-то не так – Ctrl+Z.');
        });
      }

      plugin.init = function (text) {
        $('scrub').onclick = scrub;
        selection = text || '';
        showSelection();
        $('generate').onclick = generate;
        $('again').onclick = generate;
        $('insert').onclick = insert;
      };
      plugin.event_onTargetPositionChanged = function () { readSelection(); };
      plugin.button = function () { this.executeCommand('close', ''); };
    })(window);
  </script>
</body>
</html>
